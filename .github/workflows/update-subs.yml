name: Update V2Ray Subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Process configs
        run: python scripts/process_configs.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_sub.txt splitted/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update subs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
