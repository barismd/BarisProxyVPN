name: Update V2Ray Subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Download Xray-core
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray-core
          chmod +x xray-core/xray
          ./xray-core/xray version

      - name: Process configs
        env:
          XRAY_PATH: ${{ github.workspace }}/xray-core/xray
        run: python scripts/process_configs.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_sub.txt supersub.txt splitted/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update subs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
