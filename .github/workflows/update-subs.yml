name: Update V2Ray Subscriptions

on:
  schedule:
    # Her saat başı çalışır (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:  # Manuel tetikleme imkanı

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install requests

      - name: Xray-core İndir ve Kur
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray-core
          chmod +x xray-core/xray
          echo "XRAY_PATH=$(pwd)/xray-core/xray" >> $GITHUB_ENV

      - name: Yapılandırmaları İşle
        env:
          XRAY_PATH: ${{ env.XRAY_PATH }}
        run: python scripts/process_configs.py

      - name: Değişiklikleri Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt supersub.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update subscriptions [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
