name: Update V2ray configs

on:
  schedule:
    - cron: "0 * * * *"   # saatte bir (GitHub Actions'ta gecikme birkaç dk olabilir)
  workflow_dispatch: {}     # manuel calistirma icin

permissions:
  contents: write

concurrency:
  group: update-configs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sub.txt and supersub.txt
        run: python update_configs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt supersub.txt
          git diff --cached --quiet || git commit -m "Update configs [skip ci]"
          git push
